[workspace]
members = [
    "pkresolve",
    "server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Pubky domain resolution with verified routing and TLS delegation"
license = "MIT"
repository = "https://github.com/pubky/pkresolve"
keywords = ["pubky", "pkarr", "dns", "resolution", "tls"]
categories = ["network-programming", "cryptography"]
publish = false

[workspace.dependencies]
pkresolve = { path = "pkresolve" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
